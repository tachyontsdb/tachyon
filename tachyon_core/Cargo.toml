[package]
name = "tachyon_core"
version = "0.2.0"
edition = "2021"

[features]
tachyon_internals = []
tachyon_memory_profiling = ["dep:dhat"]

[lib]
crate-type = ["lib", "cdylib"]

[[bench]]
name = "micro"
harness = false

[[bench]]
name = "query"
harness = false

[[bench]]
name = "insert"
harness = false

[[bench]]
name = "read"
harness = false

[[bench]]
name = "sqlite"
harness = false

[[bench]]
name = "sum"
harness = false

[[bench]]
name = "timescaledb"
harness = false

[[bench]]
name = "write"
harness = false

[[bench]]
name = "db_benchmark_framework"
harness = false

[dependencies]
dhat = { version = "0.3.3", optional = true }
promql-parser = { path = "../tachyondb-promql-parser", features = ["ser"] }
rusqlite = { version = "0.35.0", features = ["serde_json", "bundled", "uuid", "extra_check"] }
rustc-hash = "2.1.1"
rustix = { version = "1.0.7", features = ["fs"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
thiserror = "2.0.12"
uuid = { version = "1.16.0", features = ["v4", "fast-rng", "serde", "macro-diagnostics"] }

[dev-dependencies]
criterion = { version = "0.5.1", features = ["stable", "html_reports"] }
csv = "1.3.1"
dhat = "0.3.3"
postgres = { version = "0.19.10", features = ["with-serde_json-1", "with-uuid-1"] }
pprof = { version = "0.14.0", features = ["cpp", "flamegraph", "criterion"] }
rusqlite = { version = "0.35.0", features = ["serde_json", "bundled", "uuid", "extra_check"] }
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
uuid = { version = "1.16.0", features = ["v4", "fast-rng", "serde", "macro-diagnostics"] }

[build-dependencies]
cbindgen = "0.28.0"
