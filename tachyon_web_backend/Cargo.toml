[package]
name = "tachyon_web_backend"
version = "0.2.0"
edition = "2021"

[dependencies]
axum = { version = "0.8.4", features = ["http1", "json", "query", "macros", "ws", "tracing", "tower-log"] }
axum-macros = "0.5.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
tachyon_core = { path = "../tachyon_core" }
tokio = { version = "1.44.2", features = ["full"] }
tower-http = { version = "0.6.2", features = ["full"] }
